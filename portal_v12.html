@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0f2a5c;
  --navy-dark:#091d42;
  --navy-mid:#1a3a72;
  --blue:#1e4db7;
  --blue-light:#e8eef8;
  --blue-mid:#2563eb;
  --bg:#f4f6fb;
  --surface:#ffffff;
  --border:#dde3ef;
  --border-light:#eef1f8;
  --text:#1a2236;
  --text-sub:#52637a;
  --text-muted:#8fa0b8;
  --green:#0e8f5a;
  --green-bg:#e8f7f0;
  --amber:#b45309;
  --amber-bg:#fef3e2;
  --red:#c0392b;
  --red-bg:#fdecea;
  --radius:8px;
  --radius-lg:12px;
  --shadow:0 1px 3px rgba(15,42,92,0.08),0 1px 2px rgba(15,42,92,0.04);
  --shadow-md:0 4px 12px rgba(15,42,92,0.10),0 2px 4px rgba(15,42,92,0.06);
}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
input,textarea,select,button{font-family:inherit;}
input::placeholder,textarea::placeholder{color:var(--text-muted);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(30,77,183,0.12);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#c5cfe4;border-radius:3px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn 0.2s ease forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:0.02em;}
.badge-blue{background:#e0e9f8;color:#1e4db7;}
.badge-green{background:#e8f7f0;color:#0e6b44;}
.badge-gray{background:#eef1f8;color:#52637a;}
.badge-amber{background:#fef3e2;color:#92400e;}
/* Btn */
.btn-primary{background:var(--navy);color:#fff;border:none;border-radius:var(--radius);padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background 0.15s,box-shadow 0.15s;}
.btn-primary:hover{background:var(--navy-mid);box-shadow:var(--shadow-md);}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border);border-radius:var(--radius);padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color 0.15s,box-shadow 0.15s;}
.btn-secondary:hover{border-color:var(--navy);box-shadow:var(--shadow);}
/* Card */
.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);}
/* Table header */
.tbl-head{background:var(--bg);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-sub);letter-spacing:0.04em;}
/* Breadcrumb */
.breadcrumb{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;margin-bottom:16px;}
.breadcrumb span{color:var(--text-sub);}
/* Section title */
.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:block;width:3px;height:14px;background:var(--blue);border-radius:2px;}
/* Input */
.inp{width:100%;background:#f8fafd;border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text);transition:border-color 0.15s,box-shadow 0.15s;}
.inp:focus{background:#fff;}
/* Toggle button pair */
.toggle-btn{padding:7px 18px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-sub);transition:all 0.15s;}
.toggle-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
@media print{
  html,body{
    background:#fff!important;
    margin:0!important;padding:0!important;
    width:100%!important;height:auto!important;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif!important;
  }
  body * { visibility:hidden!important; }
  .print-modal-overlay, .print-modal-overlay * { visibility:visible!important; }
  .diagram-preview, .diagram-preview * { visibility:visible!important; }
  .diagram-preview{
    position:fixed!important;top:0!important;left:0!important;
    width:100%!important;padding:20px!important;background:#fff!important;
    z-index:9999!important;
  }
  .diagram-no-print{ display:none!important; }
  .print-modal-overlay{
    position:fixed!important;
    top:0!important;left:0!important;right:0!important;bottom:0!important;
    width:100vw!important;height:auto!important;
    background:transparent!important;
    padding:0!important;margin:0!important;
    display:block!important;
    overflow:visible!important;z-index:9999!important;
  }
  .print-modal-box{
    box-shadow:none!important;border:none!important;
    position:fixed!important;
    top:0!important;left:0!important;
    width:100vw!important;
    box-sizing:border-box!important;
    border-radius:0!important;
    padding:12mm 14mm!important;
    margin:0!important;
    max-height:none!important;overflow:visible!important;
  }
  .no-print, .no-print *{ visibility:hidden!important; display:none!important; }
  .bill-sheet{
    width:100%!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
    color-adjust:exact!important;
  }
  .bill-sheet *{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
    color-adjust:exact!important;
  }
  .bill-sheet td, .bill-sheet th, .bill-sheet div, .bill-sheet span{
    -webkit-font-smoothing:antialiased!important;
    text-rendering:optimizeLegibility!important;
    color:#000!important;
  }
  .bill-sheet [style*="color:#52637a"],
  .bill-sheet [style*="color:#9aa6bd"],
  .bill-sheet [style*="opacity"]{
    color:#222!important;
    opacity:1!important;
  }
  .bill-sheet table{page-break-inside:auto;}
  .bill-sheet tr{page-break-inside:avoid;}
  @page{
    size:A4 portrait;
    margin:10mm;
  }
}
</style>

// 料金表の参考価格（本体価格・税別）
// 生地：メロディー・キャンバス（標準）／ポリエステル 単装
// 形式: "記号-D出巾コード" : { wMm:外形寸法mm, dMm:出巾mm, manual:手動本体価格, elec:電手動本体価格 }
const RATE_KOUJOU   = 0.10; // 工場加工費
const RATE_GENBA    = 0.15; // 現場取付費
const RATE_UNSOHI   = 0.10; // 運搬費・諸経費・副資材
const RATE_TOTAL    = 1 + RATE_KOUJOU + RATE_GENBA + RATE_UNSOHI; // 1.35

function calcAwning(basePrice) {
  if(!basePrice) return null;
  const taxExcl = Math.round(basePrice * RATE_TOTAL);
  const tax     = Math.round(taxExcl * 0.1);
  const taxIncl = taxExcl + tax;
  return {
    base: basePrice,
    koujou: Math.round(basePrice * RATE_KOUJOU),
    genba:  Math.round(basePrice * RATE_GENBA),
    unsohi: Math.round(basePrice * RATE_UNSOHI),
    taxExcl,
    tax,
    taxIncl,
  };
}
let nextId=1;
// 金額は税抜。税込は×1.1で自動計算。
// オプション（すべて税抜換算）※価格表の税込表記を税抜に直して保持
function calcExt(p,days){if(days<=7)return p.ext1w*(days-1);if(days<=28)return p.ext1w*6+p.ext4w*(days-7);return p.ext1w*6+p.ext4w*21+p.ext4wplus*(days-28);}
// p.setup を設営50% / 撤去50% に分解して計算
function setupRate(mode){
  if(mode==='both') return 1.0;
  if(mode==='setup') return 0.5;
  if(mode==='teardown') return 0.5;
  return 0;
}
function calcItemSetup(p,qty,mode){
  return Math.round(p.setup * setupRate(mode)) * qty;
}
function calcTotal(item,days,setupMode){
  const p=PRICE_TABLE[item.name];if(!p)return 0;
  return p.base*item.qty + calcItemSetup(p,item.qty,setupMode) + calcExt(p,days)*Math.max(0,days-1)*item.qty;
}

function AwningPrintContent({ r, qty, mode, discount }){
  if(!r) return null;
  // 指定方式のcalcが無ければ、利用可能な方へ自動フォールバック
  let useMode = mode;
  let calc = useMode==='電手動' ? r.elecCalc : r.manualCalc;
  if(!calc){
    if(r.manualCalc){ useMode='手動'; calc=r.manualCalc; }
    else if(r.elecCalc){ useMode='電手動'; calc=r.elecCalc; }
  }
  if(!calc) return null;
  mode = useMode;
  const base = calc.base * qty;
  const koujou = calc.koujou * qty;
  const genba = calc.genba * qty;
  const unsohi = calc.unsohi * qty;
  const preSub = base + koujou + genba + unsohi;   // 値引き前の税別小計
  const origTotal = Math.round(preSub*1.1);         // 値引き前の税込合計
  let discountAmt = 0;        // 税別ベースの値引き額（マイナス）
  let targetExcl = preSub;
  if(discount && discount>0){
    targetExcl = Math.round(discount / 1.1);        // 目標税込から税別を逆算
    discountAmt = targetExcl - preSub;              // マイナス値
  }
  const sub = preSub + discountAmt;                 // 値引き後の税別小計
  const tax = Math.round(sub*0.1);
  const total = sub + tax;                          // 値引き後の税込合計（≒目標額）
  const discountTaxInclDiff = origTotal - total;    // 税込ベースの値引き相当額

  const lines = [
    {item:'本体価格', detail:`${r.spec.series}・スタンダードタイプ`, qty:`${qty}式`, unit:`${calc.base.toLocaleString()}円`, amount:`${base.toLocaleString()}円`},
    {item:'工場加工費', detail:'商品代金の10%', qty:`${qty}式`, unit:`${calc.koujou.toLocaleString()}円`, amount:`${koujou.toLocaleString()}円`},
    {item:'現場取付費', detail:'商品代金の15%', qty:`${qty}式`, unit:`${calc.genba.toLocaleString()}円`, amount:`${genba.toLocaleString()}円`},
    {item:'運搬費・諸経費・副資材', detail:'商品代金の10%', qty:`${qty}式`, unit:`${calc.unsohi.toLocaleString()}円`, amount:`${unsohi.toLocaleString()}円`},
  ];
  if(discountAmt!==0){
    lines.push({item:'特別値引き', detail:`税込${total.toLocaleString()}円調整`, qty:'1式', unit:`${discountAmt.toLocaleString()}円`, amount:`${discountAmt.toLocaleString()}円`, minus:true});
  }

  return(
    <>
      <BillHead title="御見積書" quoteDate={r.quoteDate} subject={stripHonorific(r.clientName)+' オーニングお見積もり'} addressee={withHonorific(r.clientName,r.honorific)}/>
      <BillTotalBox taxIncl={totalCalc} taxExcl={subAfterAdj} tax={taxCalc}/>
      <BillSectionTitle>ご提案内容</BillSectionTitle>
      <BillSpecTable rows={[
        ['製品名', `${r.spec.series}・スタンダードタイプ`],
        ['見積区分', mode==='電手動'?'電手動オーニング':'手動オーニング'],
        ['規格・サイズ', `${r.spec.label.split(' / ')[0]} / W${r.wMm.toLocaleString()}mm × D${(r.dM*1000).toLocaleString()}mm`],
        ['実寸目安', `間口 ${(r.wMm/1000).toFixed(1)}m / 出巾 ${r.dM}m`],
        ['生地', r.fabricSpec],
        ['下タレ', r.hasTare],
        r.hasTare==='あり'?['文字入れ', r.tareDesign==='なし'?'なし':'あり']:null,
        ['数量', `${qty} 式`],
        ['備考', r.hasRemoval.startsWith('あり（運搬費')?'撤去費は諸経費に含む':r.hasRemoval],
      ]}/>
      <BillSectionTitle>見積明細</BillSectionTitle>
      <BillDetailTable lines={lines} sub={sub} tax={tax} total={total}/>
      {discountAmt!==0 ? (
        <BillNote>
          元見積税込 {origTotal.toLocaleString()}円より、特別値引き {discountTaxInclDiff.toLocaleString()}円を適用し、税込 {total.toLocaleString()}円といたします。
        </BillNote>
      ) : (r.note ? <BillNote>{r.note}</BillNote> : null)}
      {r.isWOversize&&(
        <div style={{border:'1.5px solid #c0392b',padding:'8px 14px',fontSize:11,color:'#c0392b',marginBottom:16,lineHeight:1.7}}>
          ※ 指定間口（{r.wMm.toLocaleString()}mm）は単装最大（NS59 / 5,965mm）を超えています。本見積はNS59基準の参考価格です。現地確認のうえ最終仕様を確定いたします。
        </div>
      )}
      <BillConfirm/>
      <BillFooterName/>
    </>
  );
}
function LeasePrintContent({ data }){
  const {customerName,customerHonorific,projectName,dateStr,staff,area,items,days,setupMode,docType,
    staffFull,staffHalf,staffCost,transportNote,
    adjustLabel,adjustAmount,adj,note,
    cartSub,subTotal,subtotal,tax,total,quoteDate}=data;

  const adjVal = adj||(parseInt(adjustAmount)||0);
  const subAfterAdj = sub + adjVal;
  const taxCalc = Math.round(subAfterAdj*0.1);
  const totalCalc = subAfterAdj + taxCalc;
  const setupLabelMap={both:'設営・撤去あり',setup:'設営のみ',teardown:'撤去のみ',none:'なし'};
  const setupShort={both:'設営撤去込',setup:'設営込',teardown:'撤去込',none:''};
  const staffTotal=staffFull+staffHalf;
  const lines = items.map(item=>{
    const p=PRICE_TABLE[item.name]; if(!p) return null;
    const base=p.base*item.qty;
    const setup=calcItemSetup(p,item.qty,setupMode);
    const ext=calcExt(p,days)*Math.max(0,days-1)*item.qty;
    const tot=base+setup+ext;
    let detail=p.spec;
    if(setupMode!=='none') detail+=` ／ ${setupShort[setupMode]}`;
    if(days>1) detail+=` ／ 延長${days-1}日`;
    return {item:item.name, detail, qty:`${item.qty}`, unit:`${p.base.toLocaleString()}円`, amount:`${tot.toLocaleString()}円`};
  }).filter(Boolean);
  if(staffFull>0){
    lines.push({item:'設営スタッフ（1日）', detail:'設営・施工スタッフ', qty:`${staffFull}人`, unit:`${STAFF_FULL_PRICE.toLocaleString()}円`, amount:`${(staffFull*STAFF_FULL_PRICE).toLocaleString()}円`});
  }
  if(staffHalf>0){
    lines.push({item:'設営スタッフ（半日）', detail:'設営・施工スタッフ', qty:`${staffHalf}人`, unit:`${STAFF_HALF_PRICE.toLocaleString()}円`, amount:`${(staffHalf*STAFF_HALF_PRICE).toLocaleString()}円`});
  }
  if(adjVal && adjVal!==0){
    lines.push({item:adjustLabel||'端数調整', detail:adjVal<0?'端数値引き':'割増', qty:'1式', unit:adjVal.toLocaleString()+'円', amount:adjVal.toLocaleString()+'円', minus:adjVal<0});
  }

  return(
    <>
      <BillHead title={docType==='invoice'?'請求書':'御見積書'} dateLabel={docType==='invoice'?'請求日':'見積日'} quoteDate={quoteDate||dateStr} subject={projectName||'リース商品お見積もり'} addressee={withHonorific(customerName,customerHonorific)}/>
      <BillTotalBox taxIncl={total} taxExcl={sub} tax={tax} docType={docType}/>
      <BillSectionTitle>ご提案内容</BillSectionTitle>
      <BillSpecTable rows={[
        ['案件名', projectName||'―'],
        ['利用日数', `${days} 日間`],
        ['設営・撤去', setupLabelMap[setupMode]],
        staffTotal>0?['設営スタッフ', `${staffFull>0?`1日 ${staffFull}名`:''}${staffFull>0&&staffHalf>0?'／':''}${staffHalf>0?`半日 ${staffHalf}名`:''}`]:null,
        ['運搬費', transportNote||'別途お見積り'],
        ['現場エリア', area],
        ['担当者', staff],
        ['希望日', dateStr||'―'],
      ]}/>
      <BillSectionTitle>見積明細</BillSectionTitle>
      <BillDetailTable lines={lines} sub={subAfterAdj} tax={taxCalc} total={totalCalc}/>
      <BillNote>
        {note ? note+'　' : ''}
        {transportNote ? `運搬費：${transportNote}　` : '運搬費は現場状況により別途お見積りいたします。　'}
        利用日数・設営条件により金額が変動する場合があります。
      </BillNote>
      <BillConfirm/>
      <BillFooterName/>
    </>
  );
}
function FabricPrintContent({ results, extraItems=[], adjust=0, customer='', subject='', honorific='御中' }){
  if(!results||results.length===0) return null;
  const faceNames={1:'天面',2:'前面',3:'背面',4:'左側面',5:'右側面',6:'底面'};
  const today=new Date().toISOString().slice(0,10);
  const allLines=[];
  results.forEach((r,ri)=>{
    const label=results.length>1?`【生地${ri+1}】 `:'' ;
    if(r.splitMode&&r.splitParts){
      if(ri>0) allLines.push({rowType:'spacer'});
      const curLabel=r.itemName&&r.itemName.trim()?r.itemName.trim():(results.length>1?`カーテン${ri+1}`:'カーテン');
      allLines.push({rowType:'header', item:curLabel});
      r.splitParts.forEach((p,pi)=>{
        const posLabel=pi===0?'上部':pi===r.splitParts.length-1?'下部':'中部'+pi;
        allLines.push({rowType:'child', item:posLabel, detail:`${p.fabric?p.fabric.no+'番 '+p.fabric.name:'－'}　${p.yoko}mm×${p.h}mm＝${p.area.toFixed(3)}㎡${r.gradeId!=='none'?'　'+GRADES.find(g=>g.id===r.gradeId).label:''}`, qty:`${p.area.toFixed(3)}㎡`, unit:`${p.fabric?p.fabric.designPrice.toLocaleString():0}円/㎡`, amount:`${(p.cost*(r.fabricQty||1)).toLocaleString()}円`});
      });
      if(r.hasMT) allLines.push({rowType:'child', item:'マジックテープ', detail:`${r.mtLen}m × ¥2,200`, qty:`${r.mtLen}m`, unit:'2,200円/m', amount:`${r.mtCost.toLocaleString()}円`});
      if(r.hasZip) allLines.push({rowType:'child', item:'ファスナー', detail:`H${r.zipH}mm × ${r.zipCnt}本（${r.zipUnits}単位）`, qty:`${r.zipUnits}単位`, unit:'1,200円/0.5m', amount:`${r.zipCost.toLocaleString()}円`});
      return;
    }
    let dimText='';
    if(r.estType==='sheet'&&r.dims&&r.dims.tate&&r.dims.yoko){
      dimText=`【タテ${r.dims.tate}mm × ヨコ${r.dims.yoko}mm ＝ ${r.area.toFixed(3)}㎡】`;
    }else if(r.estType==='box'&&r.dims){
      dimText=`【W${Math.round(r.dims.W*1000)}mm × D${Math.round(r.dims.D*1000)}mm × H${Math.round(r.dims.H*1000)}mm ＝ ${r.area.toFixed(3)}㎡】`;
    }else{
      dimText=`【${r.area.toFixed(3)}㎡】`;
    }
    const itemName=r.itemName&&r.itemName.trim()?r.itemName.trim():(results.length>1?`生地${ri+1}　製作設計`:'製作設計');
    const fQty=r.fabricQty||1;
    const perSheet=Math.round(r.fabricCost/fQty);
    allLines.push({item:itemName, detail:`${r.fabric.no}番 ${r.fabric.name}${r.gradeId!=='none'?'　'+GRADES.find(g=>g.id===r.gradeId).label:''}　${dimText}`, qty:fQty>1?`${fQty}枚`:`${r.area.toFixed(3)}㎡`, unit:fQty>1?`${perSheet.toLocaleString()}円/枚`:`${r.fabric.designPrice.toLocaleString()}円/㎡`, amount:`${r.fabricCost.toLocaleString()}円`});
    if(r.hasMT) allLines.push({item:label+'マジックテープ', detail:`${r.mtLen}m × ¥2,200`, qty:`${r.mtLen}m`, unit:'2,200円/m', amount:`${r.mtCost.toLocaleString()}円`});
    if(r.hasZip) allLines.push({item:label+'ファスナー', detail:`H${r.zipH}mm × ${r.zipCnt}本（${r.zipUnits}単位）`, qty:`${r.zipUnits}単位`, unit:'1,200円/0.5m', amount:`${r.zipCost.toLocaleString()}円`});
  });
  const validExtras=extraItems.filter(it=>it.name&&(parseInt(it.amount)||0)!==0);
  validExtras.forEach(it=>{
    allLines.push({item:it.name, detail:it.detail||'', qty:'1式', unit:'', amount:`${(parseInt(it.amount)||0).toLocaleString()}円`});
  });
  const extraSum=validExtras.reduce((a,it)=>a+(parseInt(it.amount)||0),0);

  const totalSubRaw=results.reduce((a,r)=>a+r.sub,0)+extraSum;
  const baseTaxIncl=totalSubRaw+Math.round(totalSubRaw*0.1);
  const totalAll=baseTaxIncl+adjust;
  const totalSub=Math.round(totalAll/1.1);
  const totalTax=totalAll-totalSub;
  if(adjust!==0) allLines.push({item:'端数調整',detail:adjust<0?'端数値引き':'割増',qty:'1式',unit:adjust.toLocaleString()+'円',amount:adjust.toLocaleString()+'円',minus:adjust<0});
  const specRows=[];
  results.forEach((r,ri)=>{
    const excludedFaces=r.faces?r.faces.filter(f=>!f.included).map(f=>`${['','①','②','③','④','⑤','⑥'][f.id]} ${faceNames[f.id]}なし`):[];
    if(results.length>1) specRows.push([`── 生地${ri+1}`, '']);
    specRows.push(['製品名', r.estType==='box'?'箱型カバー':'平面シート・幕']);
    specRows.push(['生地', `${r.fabric.no}番 ${r.fabric.name}`]);
    if(r.estType==='box'&&r.dims) specRows.push(['仕上がり寸法', `W${r.dims.W}m × D${r.dims.D}m × H${r.dims.H}m`]);
    if(r.estType==='sheet'&&r.dims&&r.dims.tate) specRows.push(['仕上がり寸法', `${r.dims.tate}mm × ${r.dims.yoko}mm ＝ ${r.area.toFixed(3)}㎡`]);
    if(excludedFaces.length>0) specRows.push(['不要面', excludedFaces.join('、')]);
    specRows.push(['付属品', `${r.hasZip?`ファスナー H${r.zipH}mm×${r.zipCnt}本`:'ファスナーなし'} / ${r.hasMT?`マジックテープ ${r.mtLen}m`:'マジックテープなし'}`]);
  });

  return(
    <>
      <BillHead title="御見積書" quoteDate={today} subject={subject||(results.length>1?'生地・カバー複数製作':results[0].estType==='box'?'カバー製作':'シート・幕製作')} addressee={withHonorific(customer,honorific)}/>
      <BillTotalBox taxIncl={totalAll} taxExcl={totalSub} tax={totalTax}/>
      <BillSectionTitle>ご提案内容</BillSectionTitle>
      <BillSpecTable rows={specRows}/>
      <BillSectionTitle>見積明細</BillSectionTitle>
      <BillDetailTable lines={allLines} sub={totalSub} tax={totalTax} total={totalAll}/>
      <BillNote>
        <div>● 本見積は各生地番号での概算です。縫い代・仕様詳細により金額が変動する場合があります。</div>
        {results.some(r=>r.hasZip)&&<div>● ファスナーは0.5mあたり¥1,200で算出しています。</div>}
        {results.some(r=>r.estType==='box')&&<div>● 箱型カバーの展開図は別紙参照。</div>}
      </BillNote>
      <BillConfirm/>

function QuotePage({addActivity, user}){
  const [cart,setCart]=useState([]);
  const [selCat,setSelCat]=useState(null);
  const [search,setSearch]=useState('');

  const [days,setDays]=useState(1);
  const [setupMode,setSetupMode]=useState('none');
  const [staffFull,setStaffFull]=useState(0);
  const [staffHalf,setStaffHalf]=useState(0);
  const [transportNote,setTransportNote]=useState('');
  const [adjustLabel,setAdjustLabel]=useState('特別値引き');
  const [adjustAmount,setAdjustAmount]=useState('');
  const [customerName,setCustomerName]=useState('');
  const [customerHonorific,setCustomerHonorific]=useState('御中');
  const [projectName,setProjectName]=useState('');
  const [dateStr,setDateStr]=useState('');
  const [staff,setStaff]=useState('');
  const [showPdf,setShowPdf]=useState(false);
  const [docType,setDocType]=useState('estimate');

  // ログインユーザー名をstaffの初期値に使う
  useEffect(()=>{
    if(user && !staff){
      const name = user.user_metadata?.display_name || user.email || '';
      setStaff(name);
    }
  },[user]);

  const allItems = Object.entries(PRICE_TABLE).map(([name,v])=>({name,...v}));
  const filtered = allItems.filter(it=>{
    const matchCat = !selCat || it.cat===selCat;
    const q = search.trim().toLowerCase();
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.spec.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  const groups={};
  filtered.forEach(it=>{ if(!groups[it.cat]) groups[it.cat]=[]; groups[it.cat].push(it); });

  function addToCart(name){
    const item = PRICE_TABLE[name];
    if(!item) return;
    setCart(prev=>{
      const exist=prev.find(c=>c.name===name);
      if(exist) return prev.map(c=>c.name===name?{...c,qty:c.qty+1}:c);
      return [...prev,{name,qty:1,...item}];
    });
  }
  function updateQty(name,v){ setCart(prev=>prev.map(c=>c.name===name?{...c,qty:Math.max(1,parseInt(v)||1)}:c)); }
  function removeFromCart(name){ setCart(prev=>prev.filter(c=>c.name!==name)); }
  const calcExt=(item,d)=>{
    if(d<=7) return item.ext1w*(d-1);
    if(d<=28) return item.ext1w*6+item.ext4w*(d-7);
    return item.ext1w*6+item.ext4w*21+item.ext4wplus*(d-28);
  };
  const calcItemSetup=(item,mode)=>{
    if(mode==='both') return item.setup;
    if(mode==='setup'||mode==='teardown') return Math.round(item.setup*0.5);
    return 0;
  };
  const itemTotal=(item,d,mode)=>Math.ceil((item.base+calcExt(item,d)+calcItemSetup(item,mode))*item.qty/10)*10;

  const cartSub = cart.reduce((a,it)=>a+itemTotal(it,days,setupMode),0);
  const staffCost = staffFull*STAFF_FULL_PRICE + staffHalf*STAFF_HALF_PRICE;
  const adj = parseInt(adjustAmount)||0;

              customer_name: customerName||'',

              items: cart.map(it=>({name:it.name, qty:it.qty, cat:it.cat})),
            });

            <div style={{background:'linear-gradient(135deg,#0f2a5c,#1e4db7)',borderRadius:12,padding:16,color:'#fff'}}>
              <div style={{fontSize:11,opacity:0.75,marginBottom:4}}>お見積金額（税込）</div>
              <div style={{fontSize:26,fontWeight:900,marginBottom:8}}>¥{total.toLocaleString()}</div>
              <div style={{fontSize:11,opacity:0.7,display:'grid',gap:2}}>
                <div style={{display:'flex',justifyContent:'space-between'}}><span>商品小計</span><span>¥{cartSub.toLocaleString()}</span></div>
                {staffCost>0&&<div style={{display:'flex',justifyContent:'space-between'}}><span>スタッフ費</span><span>¥{staffCost.toLocaleString()}</span></div>}
                {adj!==0&&<div style={{display:'flex',justifyContent:'space-between'}}><span>{adjustLabel}</span><span>{adj<0?'-':''}¥{Math.abs(adj).toLocaleString()}</span></div>}
                <div style={{display:'flex',justifyContent:'space-between'}}><span>消費税10%</span><span>¥{tax.toLocaleString()}</span></div>
              </div>
              {cart.length>0&&(
                <RoundingAdjust
                  grandTotal={baseSubTotal}
                  hasAdj={adj!==0}
                  adjValue={adjustAmount}
                  onAdjChange={v=>{setAdjustLabel('端数値引き');setAdjustAmount(v);}}
                  onApply={(target,diff,label)=>{setAdjustLabel('端数値引き');setAdjustAmount(String(diff));}}
                  onReset={()=>{setAdjustLabel('特別値引き');setAdjustAmount('');}}
                />
              )}
              <button disabled={cart.length===0} onClick={()=>{
                addActivity&&addActivity({id:genId('Q'),icon:'📋',title:'リース見積もり',company:withHonorific(customerName||'お客様'),status:'作成中',time:nowTime(),total});
                setShowPdf(true);
              }} style={{width:'100%',marginTop:10,background:cart.length?'#fff':'rgba(255,255,255,0.3)',color:cart.length?C.navy:'rgba(255,255,255,0.5)',border:'none',borderRadius:8,padding:11,fontSize:13,fontWeight:700,cursor:cart.length?'pointer':'default'}}>
                📄 PDF見積書を作成
              </button>

            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
function AwningPage({addActivity}){
  const [clientName,  setClientName]  = useState('');
  const [honorific,   setHonorific]   = useState('御中');
  const [quoteDate,   setQuoteDate]   = useState(new Date().toISOString().slice(0,10));
  const [quoteNo,     setQuoteNo]     = useState('AW-' + new Date().getFullYear() + '-001');
  const [site,        setSite]        = useState('');
  const [wInput,      setWInput]      = useState('');   // 間口W (mm)
  const [dInput,      setDInput]      = useState('');   // 出巾D (m)
  const [fabricSpec,  setFabricSpec]  = useState('ストライプ（標準）');
  const [hasTare,     setHasTare]     = useState('なし');
  const [tareDesign,  setTareDesign]  = useState('なし');
  const [hasRemoval,  setHasRemoval]  = useState('なし');
  const [qty,         setQty]         = useState(1);
  const [modePattern, setModePattern] = useState('両方'); // 手動のみ / 電手動のみ / 両方
  const [note,        setNote]        = useState('');
  const [result,      setResult]      = useState(null);
  const [showPreview, setShowPreview] = useState(false);
  const [showAwningPdf, setShowAwningPdf] = useState(false);
  const [pdfMode, setPdfMode] = useState('手動');       // PDF帳票の方式（手動/電手動）
  const [discount, setDiscount] = useState('');          // 特別値引き（税込目標額）
  const [awningAdjInput,setAwningAdjInput]=useState(''); // 端数調整入力欄
  const [warnOversize, setWarnOversize] = useState(false);   // 最大幅超過ダイアログ表示
  const [warnConfirmed, setWarnConfirmed] = useState(false); // 続行確認済みフラグ
  const MAX_W = 5965; // 単装最大間口 NS59

  const fmtDate = (d) => {
    if(!d) return '';
    const [y,m,dd] = d.split('-');
    return `${y}年${parseInt(m)}月${parseInt(dd)}日`;
  };

  const handleWChange = (val) => {
    setWInput(val);
    setWarnConfirmed(false);
    setWarnOversize(parseInt(val) > MAX_W);
  };
  const findSpec = (wMm, dM) => {
    const dMm = Math.round(parseFloat(dM) * 1000);
    const effW = Math.min(parseInt(wMm), MAX_W);
    const candidates = Object.entries(AWNING_PRICE).filter(([,v]) => {
      return v.dMm <= dMm + 50 && v.dMm >= dMm - 50 && v.wMm <= effW;
    });
    if(candidates.length === 0) return null;
    candidates.sort((a,b) => b[1].wMm - a[1].wMm);
    return { key: candidates[0][0], ...candidates[0][1] };
  };

  const handleCalc = () => {
    const wMm = parseInt(wInput);
    const dM  = parseFloat(dInput);
    if(!wMm || !dM || !clientName.trim()) return;
    if(wMm > MAX_W && !warnConfirmed) {
      setWarnOversize(true);
      return;
    }
    doCalc(wMm, dM);
  };

  const doCalc = (wMm, dM) => {
    const spec = findSpec(wMm, dM);
    const hasPrice = spec && (spec.manual !== null || spec.elec !== null);
    const isOversize = !spec;
    const isWOversize = wMm > MAX_W;

    const usedSpec = spec || {
      label: `NS59 / D${dM}m（最大規格参考）`,
      wMm: 5965, dMm: Math.round(dM * 1000),
      series: 'ニュースーパーマキシム',
      manual: 485000, elec: 626000,
    };

    const manualCalc = (modePattern !== '電手動のみ') ? calcAwning(usedSpec.manual) : null;
    const elecCalc   = (modePattern !== '手動のみ')   ? calcAwning(usedSpec.elec)   : null;

    const newResult = {
      clientName, honorific, quoteDate, quoteNo, site, wMm, dM,
      fabricSpec, hasTare, tareDesign, hasRemoval, qty,
      modePattern, note, spec: usedSpec, isOversize, isWOversize,
      hasPrice, manualCalc, elecCalc,
    };
    setResult(newResult);
    setShowPreview(true);
    setWarnOversize(false);
    const taxIncl = modePattern === '手動のみ'
      ? (manualCalc ? manualCalc.taxIncl * qty : null)
      : modePattern === '電手動のみ'
        ? (elecCalc ? elecCalc.taxIncl * qty : null)
        : null; // 両方の場合は金額表示なし
    const priceLabel = taxIncl
      ? ` ¥${taxIncl.toLocaleString()}（税込）`
      : modePattern === '両方' ? ' 手動・電手動 2パターン' : '';
    addActivity({
      id: quoteNo,
      icon: '🏠',
      title: `オーニング見積もり`,
      company: (clientName||'（顧客名未入力）') + ' 様',
      status: '作成中',
      time: nowTime(),
      sub: `${usedSpec.label}${priceLabel}`,
    });
  };

  const inp = {
    width:'100%', background:'#f8fafd',
    border:`1px solid ${C.border}`, borderRadius:7,
    padding:'8px 10px', fontSize:12, color:C.text,
  };
  const lbl = (t,req=false) => (
    <div style={{fontSize:11,color:C.textSub,fontWeight:600,marginBottom:4}}>
      {t}{req&&<span style={{color:C.red,marginLeft:2}}>*</span>}
    </div>
  );

  return(
    <div className="fade-in" style={{maxWidth:1100,margin:'0 auto',padding:'24px 20px'}}>

      {warnOversize && !warnConfirmed && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'#fff',borderRadius:14,padding:'28px 32px',maxWidth:440,width:'90%',boxShadow:'0 8px 40px rgba(0,0,0,0.25)'}}>

            <div style={{fontSize:16,fontWeight:900,color:C.navy,textAlign:'center',marginBottom:10}}>
              単装最大サイズを超えています
            </div>
            <div style={{fontSize:13,color:C.text,lineHeight:1.75,marginBottom:6}}>
              ご指定の間口 <strong>{parseInt(wInput).toLocaleString()} mm</strong> は、
              単装タイプの最大規格 <strong>NS59（5,965 mm）</strong> を超えています。
            </div>
            <div style={{fontSize:13,color:C.text,lineHeight:1.75,marginBottom:20}}>
              このまま続行する場合は <strong>NS59（5,965 mm）</strong> を基準に概算金額を算出します。
              正式な対応については現地確認・メーカー確認が必要です。
            </div>
            <div style={{display:'flex',gap:10}}>
              <button
                onClick={() => { setWarnOversize(false); setWInput(''); }}
                style={{flex:1,background:'#f1f5f9',border:`1px solid ${C.border}`,borderRadius:8,padding:'10px',fontSize:13,fontWeight:600,cursor:'pointer',color:C.text}}>
                ← 間口を修正する
              </button>
              <button
                onClick={() => { setWarnConfirmed(true); setWarnOversize(false); doCalc(parseInt(wInput), parseFloat(dInput)); }}
                style={{flex:1,background:C.amber,border:'none',borderRadius:8,padding:'10px',fontSize:13,fontWeight:800,cursor:'pointer',color:'#fff'}}>
                NS59で続行する
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{fontSize:12,color:C.textSub,marginBottom:8}}>見積もり › オーニング見積もり</div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <div style={{width:40,height:40,background:`linear-gradient(135deg,${C.navy},${C.navyLight})`,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🏠</div>
        <div>
          <h1 style={{fontSize:22,fontWeight:900,color:C.navy}}>オーニング見積もり</h1>
          <p style={{fontSize:12,color:C.textSub}}>ニュースーパーマキシム スタンダードタイプ｜BXテンパル</p>
        </div>
        <span style={{background:'#10b981',color:'#fff',fontSize:10,borderRadius:5,padding:'3px 8px',fontWeight:800,marginLeft:4}}>NEW</span>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'380px 1fr',gap:16,alignItems:'start'}}>

        <div style={{display:'flex',flexDirection:'column',gap:12}}>

          <Card>
            <SectionLabel>見積書情報</SectionLabel>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div>{lbl('宛名',true)}<div style={{display:'flex',gap:6}}><input style={{...inp,flex:1}} value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="例）株式会社〇〇"/><HonorificSelect value={honorific} onChange={setHonorific}/></div></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div>{lbl('見積日')}<input type="date" style={inp} value={quoteDate} onChange={e=>setQuoteDate(e.target.value)}/></div>
                <div>{lbl('見積番号')}<input style={inp} value={quoteNo} onChange={e=>setQuoteNo(e.target.value)}/></div>
              </div>
              <div>{lbl('施工場所')}<input style={inp} value={site} onChange={e=>setSite(e.target.value)} placeholder="例）那覇市〇〇 1F 店舗正面"/></div>
            </div>
          </Card>

          <Card>
            <SectionLabel>仕様・寸法</SectionLabel>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div>
                  {lbl('間口 W（mm）',true)}
                  <input type="number"
                    style={{...inp, borderColor: warnOversize ? C.amber : C.border}}
                    value={wInput}
                    onChange={e=>handleWChange(e.target.value)}
                    placeholder="例）5965"/>
                  {warnOversize ? (
                    <div style={{marginTop:4,fontSize:10,color:C.amber,fontWeight:700}}>

                  ) : (
                    <div style={{fontSize:10,color:C.textMuted,marginTop:3}}>料金表の規格以下で最大値を自動選択　単装最大：5,965mm</div>
                  )}
                </div>
                <div>
                  {lbl('出巾 D（m）',true)}
                  <input type="number" step="0.5" style={inp} value={dInput} onChange={e=>setDInput(e.target.value)} placeholder="例）3.0"/>
                </div>
              </div>
              <div>
                {lbl('生地仕様')}
                <select style={{...inp}} value={fabricSpec} onChange={e=>setFabricSpec(e.target.value)}>
                  {['ストライプ（標準）','無地ネイビー','無地ホワイト','無地グリーン','カスタム（別途確認）'].map(o=><option key={o}>{o}</option>)}
                </select>
                {fabricSpec==='無地ネイビー'&&(
                  <div style={{marginTop:6,background:C.amberLight,border:`1px solid ${C.amberBorder}`,borderRadius:6,padding:'6px 10px',fontSize:11,color:C.amber}}>
                    ⚠️ ネイビー生地に文字入れする場合は白文字または淡色を推奨
                  </div>
                )}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div>
                  {lbl('下タレ')}
                  <select style={{...inp}} value={hasTare} onChange={e=>setHasTare(e.target.value)}>
                    {['なし','あり'].map(o=><option key={o}>{o}</option>)}
                  </select>
                </div>
                <div>
                  {lbl('下タレ 柄・文字入れ')}
                  <select style={{...inp}} value={tareDesign} onChange={e=>setTareDesign(e.target.value)} disabled={hasTare==='なし'}>

                  </select>
                </div>
              </div>
            </div>
          </Card>

          <Card>
            <SectionLabel>操作方式・施工条件</SectionLabel>

                      padding:'6px 12px',border:`1.5px solid ${modePattern===v?C.navy:C.border}`,
                      borderRadius:20,background:modePattern===v?C.blueLight:'#f8fafc',
                      color:modePattern===v?C.navy:C.textSub,fontWeight:modePattern===v?700:400}}>
                      <input type="radio" style={{display:'none'}} checked={modePattern===v} onChange={()=>setModePattern(v)}/>{v}

                  ))}

              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div>
                  {lbl('撤去')}
                  <select style={{...inp}} value={hasRemoval} onChange={e=>setHasRemoval(e.target.value)}>

            </div>
          </Card>

          <button onClick={handleCalc}
            disabled={!clientName.trim()||!wInput||!dInput}

              </div>
            </Card>
          ):(
            <>
            {showAwningPdf&&(
              <PrintModal onClose={()=>setShowAwningPdf(false)}>
                <AwningPrintContent r={result} qty={qty} mode={pdfMode} discount={discount?parseInt(discount):0}/>

              onPrint={()=>setShowAwningPdf(true)}
              pdfMode={pdfMode} setPdfMode={setPdfMode}
              discount={discount} setDiscount={setDiscount}
              awningAdjInput={awningAdjInput} setAwningAdjInput={setAwningAdjInput}/>

            </>
          )}
        </div>
      </div>
    </div>
  );
}

    <div style={{background:C.white,border:`2px solid ${C.navy}`,borderRadius:12,overflow:'hidden',boxShadow:'0 4px 20px rgba(26,47,94,0.12)'}}>

      <div style={{background:`linear-gradient(135deg,${C.navyDark} 0%,${C.navy} 60%,${C.navyMid} 100%)`,padding:'16px 22px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.6)',marginBottom:2,letterSpacing:'0.1em'}}>砂辺松福テント株式会社</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>〒901-2122 沖縄県浦添市勢理客2-15-26　TEL 098-877-1028</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:22,fontWeight:900,color:C.white,letterSpacing:'0.1em'}}>御 見 積 書</div>

          <div style={{textAlign:'right',fontSize:12,color:C.textSub,lineHeight:1.8}}>

function calcBoxFaces(W,D,H,excluded){
  return [{id:1,name:'① 天面',area:W*D},{id:2,name:'② 前面',area:W*H},{id:3,name:'③ 背面',area:W*H},{id:4,name:'④ 左側面',area:D*H},{id:5,name:'⑤ 右側面',area:D*H},{id:6,name:'⑥ 底面',area:W*D}].map(f=>({...f,included:!excluded.includes(f.id)}));
}

function genIronId(){ return 'iron_'+Date.now()+'_'+Math.floor(Math.random()*1000); }

function IronPage(){
  const [selCat, setSelCat] = useState(null);
  const [search, setSearch] = useState('');
  const [lines, setLines] = useState([]); // {id,sub,spec,delivery,qty}
  const [showPdf, setShowPdf] = useState(false);
  const [customer, setCustomer] = useState('');
  const [subject, setSubject] = useState('');
  const [adjustLabel, setAdjustLabel] = useState('');
  const [adjustAmount, setAdjustAmount] = useState('');
  const filtered = IRON_DATA.filter(d=>{
    const matchCat = !selCat || d.cat === selCat;
    const q = search.trim().toLowerCase();
    const matchSearch = !q || d.spec.toLowerCase().includes(q) || d.sub.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  const groups = {};
  filtered.forEach(d=>{
    if(!groups[d.sub]) groups[d.sub]=[];
    groups[d.sub].push(d);
  });

  function addLine(item){
    setLines(prev=>{
      const exist = prev.find(l=>l.spec===item.spec&&l.sub===item.sub);
      if(exist) return prev.map(l=>l.spec===item.spec&&l.sub===item.sub?{...l,qty:l.qty+1}:l);
      return [...prev,{id:genIronId(),cat:item.cat,sub:item.sub,spec:item.spec,delivery:item.delivery,qty:1}];
    });
  }
  function updateQty(id,v){ setLines(prev=>prev.map(l=>l.id===id?{...l,qty:Math.max(1,v)}:l)); }
  function removeLine(id){ setLines(prev=>prev.filter(l=>l.id!==id)); }

  const unitPrice = l => Math.round(l.delivery * 1.2);
  const lineTotal = l => unitPrice(l) * l.qty;
  const sub = lines.reduce((a,l)=>a+lineTotal(l),0);
  const adj = parseInt(adjustAmount)||0;
  const subAdj = sub + adj;
  const tax = Math.round(subAdj*0.1);
  const total = subAdj + tax;

    <div>

        <PrintModal onClose={()=>setShowPdf(false)}>

function IronPrintContent({lines,customer,subject,unitPrice,lineTotal,sub,adj,adjLabel,subAdj,tax,total}){
  const today = new Date().toISOString().slice(0,10);
  const pdfLines = lines.map(l=>({
    item:l.spec, detail:l.sub,
    qty:`${l.qty}本`, unit:`¥${unitPrice(l).toLocaleString()}`,
    amount:`¥${lineTotal(l).toLocaleString()}`
  }));
  if(adj!==0) pdfLines.push({item:adjLabel||'調整',detail:'',qty:'1式',unit:'',amount:`${adj<0?'-':''}¥${Math.abs(adj).toLocaleString()}`,minus:adj<0});
  return(
    <>
      <BillHead title="御見積書" quoteDate={today}
        subject={subject||'鉄工材料'} addressee={customer?withHonorific(customer):' 御中'}/>

      <BillSpecTable rows={[
        ['品目数',`${lines.length}品番`],

  );
}
function CurtainFabricCalc({onAdd}){
  const [step,setStep]=useState('type');
  const [estType,setEstType]=useState(null);
  const [fabric,setFabric]=useState(null);
  const [search,setSearch]=useState('');
  const [sheetDims,setSheetDims]=useState({tate:'',yoko:''});
  const [lossRate,setLossRate]=useState(15);
  const [gradeId,setGradeId]=useState('none');
  const [hasMT,setHasMT]=useState(false);
  const [mtLen,setMtLen]=useState('');
  const [hasZip,setHasZip]=useState(false);
  const [zipH,setZipH]=useState('');
  const [zipCnt,setZipCnt]=useState(1);
  const [fabricQty,setFabricQty]=useState(1);
  const [result,setResult]=useState(null);

  const filtered=FABRIC_LIST.filter(f=>f.name.toLowerCase().includes(search.toLowerCase())||String(f.no).includes(search));
  const inp={width:'100%',padding:'8px 11px',border:`1.5px solid ${C.border}`,borderRadius:8,fontSize:12,boxSizing:'border-box',marginTop:3,background:'#f8fafd'};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:C.navy,marginTop:10,marginBottom:2}}>{t}</div>;

  const calculate=()=>{
    if(!fabric) return;
    const grade=GRADES.find(g=>g.id===gradeId);
    const lm=1+lossRate/100, gm=1+grade.rate;
    let area=0;
    if(estType==='sheet'){ area=(parseFloat(sheetDims.tate)/1000)*(parseFloat(sheetDims.yoko)/1000); }
    const fabricCost=Math.round(area*lm*gm*fabric.designPrice);
    const mtCost=hasMT?Math.round(parseFloat(mtLen||0)*2200):0;
    let zipCost=0,zipUnits=0;
    if(hasZip){ zipUnits=Math.ceil(parseFloat(zipH||0)/0.5); zipCost=zipUnits*parseInt(zipCnt||1)*1200; }
    const qty=parseInt(fabricQty||1);
    const sub=Math.round((fabricCost+mtCost+zipCost)*qty);
    const tax=Math.round(sub*0.1);
    setResult({fabric,area,lossRate:lossRate/100,gradeId,fabricCost:fabricCost*qty,
      hasMT,mtLen:parseFloat(mtLen||0),mtCost:mtCost*qty,
      hasZip,zipH:parseFloat(zipH||0),zipCnt:parseInt(zipCnt||1),zipUnits,zipCost:zipCost*qty,
      sub,tax,total:sub+tax,fabricQty:qty});
    setStep('result');
  };

  const reset=()=>{ setStep('type');setEstType(null);setFabric(null);setSearch('');
    setSheetDims({tate:'',yoko:''});setLossRate(15);setGradeId('none');
    setHasMT(false);setMtLen('');setHasZip(false);setZipH('');setZipCnt(1);setFabricQty(1);setResult(null); };

  return(
    <div style={{background:'#f0f9ff',borderRadius:10,border:'1.5px solid #7dd3fc',padding:14}}>
      <div style={{fontSize:12,fontWeight:800,color:'#0369a1',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
        🧵 生地製作の計算
        {result&&<span style={{background:'#0369a1',color:'#fff',borderRadius:4,padding:'1px 8px',fontSize:10}}>計算済 ¥{result.sub.toLocaleString()}</span>}
      </div>

      {step==='type'&&(
        <div style={{display:'flex',gap:8}}>
          {[{id:'sheet',label:'📄 平面シート・幕'}].map(t=>(
            <button key={t.id} onClick={()=>{setEstType(t.id);setStep('fabric');}}
              style={{flex:1,padding:'8px 12px',border:`1.5px solid ${C.border}`,borderRadius:8,cursor:'pointer',
                background:'#fff',fontSize:12,fontWeight:700,color:C.navy}}>
              {t.label}
            </button>
          ))}
        </div>
      )}

      {step==='fabric'&&(
        <div>
          <input style={inp} placeholder="生地名・No.で検索..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <div style={{maxHeight:180,overflowY:'auto',border:`1px solid ${C.border}`,borderRadius:6,marginTop:6,background:'#fff'}}>
            {filtered.map((f,i)=>(
              <div key={i} onClick={()=>setFabric(f)}
                style={{padding:'7px 10px',cursor:'pointer',borderBottom:`1px solid #f1f5f9`,
                  background:fabric===f?'#eff4ff':'transparent',display:'flex',justifyContent:'space-between',alignItems:'center'}}
                onMouseOver={e=>e.currentTarget.style.background=fabric===f?'#eff4ff':'#f8fafc'}
                onMouseOut={e=>e.currentTarget.style.background=fabric===f?'#eff4ff':'transparent'}>
                <span style={{fontSize:11,color:C.navy,fontWeight:600}}>No.{f.no}{f.cut?'（切）':'（反）'}　{f.name.split('（反）').join('').split('（切）').join('')}</span>
                <span style={{fontSize:10,color:C.textSub}}>¥{f.designPrice.toLocaleString()}/㎡</span>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <button onClick={()=>setStep('type')} style={{padding:'6px 12px',border:`1px solid ${C.border}`,borderRadius:6,background:'#fff',fontSize:11,cursor:'pointer'}}>← 戻る</button>
            <button disabled={!fabric} onClick={()=>setStep('dims')}
              style={{flex:1,padding:'6px 12px',background:fabric?C.navy:'var(--border)',color:'#fff',border:'none',borderRadius:6,fontSize:11,fontWeight:700,cursor:fabric?'pointer':'default'}}>
              {fabric?`「${fabric.name}」で次へ →`:'生地を選択'}
            </button>
          </div>
        </div>
      )}

      {step==='dims'&&(
        <div>
          {lbl('縦サイズ（mm）')}<input style={inp} type="number" placeholder="例：2900" value={sheetDims.tate} onChange={e=>setSheetDims(p=>({...p,tate:e.target.value}))}/>
          {lbl('横サイズ（mm）')}<input style={inp} type="number" placeholder="例：1700" value={sheetDims.yoko} onChange={e=>setSheetDims(p=>({...p,yoko:e.target.value}))}/>
          {lbl('ロス率（%）')}<input style={inp} type="number" value={lossRate} onChange={e=>setLossRate(Number(e.target.value))}/>
          {lbl('グレード')}
          <select value={gradeId} onChange={e=>setGradeId(e.target.value)} style={{...inp,appearance:'none'}}>
            {GRADES.map(g=><option key={g.id} value={g.id}>{g.label}</option>)}
          </select>
          {lbl('数量（枚）')}
          <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4}}>
            <button onClick={()=>setFabricQty(q=>Math.max(1,q-1))} style={{width:28,height:28,border:`1px solid ${C.border}`,borderRadius:5,background:'#fff',cursor:'pointer',fontWeight:700,fontSize:16}}>－</button>
            <span style={{fontSize:16,fontWeight:800,color:C.navy,minWidth:24,textAlign:'center'}}>{fabricQty}</span>
            <button onClick={()=>setFabricQty(q=>q+1)} style={{width:28,height:28,border:`1px solid ${C.border}`,borderRadius:5,background:'#fff',cursor:'pointer',fontWeight:700,fontSize:16}}>＋</button>
            <span style={{fontSize:11,color:C.textSub}}>枚</span>
          </div>
          {lbl('付属品')}
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,cursor:'pointer',marginTop:4}}>
            <input type="checkbox" checked={hasMT} onChange={e=>setHasMT(e.target.checked)}/> マジックテープ
            {hasMT&&<input style={{...inp,width:80,marginTop:0}} type="number" placeholder="m" value={mtLen} onChange={e=>setMtLen(e.target.value)}/>}
          </label>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,cursor:'pointer',marginTop:4}}>
            <input type="checkbox" checked={hasZip} onChange={e=>setHasZip(e.target.checked)}/> ファスナー
            {hasZip&&<><input style={{...inp,width:60,marginTop:0}} type="number" placeholder="H(m)" value={zipH} onChange={e=>setZipH(e.target.value)}/>
            <input style={{...inp,width:50,marginTop:0}} type="number" placeholder="本" value={zipCnt} onChange={e=>setZipCnt(e.target.value)}/></>}
          </label>
          <div style={{display:'flex',gap:6,marginTop:10}}>
            <button onClick={()=>setStep('fabric')} style={{padding:'6px 12px',border:`1px solid ${C.border}`,borderRadius:6,background:'#fff',fontSize:11,cursor:'pointer'}}>← 戻る</button>
            <button disabled={!sheetDims.tate||!sheetDims.yoko} onClick={calculate}
              style={{flex:1,padding:'6px 12px',background:C.navy,color:'#fff',border:'none',borderRadius:6,fontSize:11,fontWeight:700,cursor:'pointer'}}>
              🧮 計算する
            </button>
          </div>
        </div>
      )}

      {step==='result'&&result&&(
        <div>
          <div style={{background:'#fff',borderRadius:7,padding:'10px 12px',marginBottom:8}}>
            <div style={{fontSize:11,color:C.textSub,marginBottom:4}}>{result.fabric.name}　{result.area.toFixed(3)}㎡ × {result.fabricQty}枚</div>
            <div style={{fontSize:18,fontWeight:900,color:C.navy}}>¥{result.sub.toLocaleString()}<span style={{fontSize:11,fontWeight:400,color:C.textSub,marginLeft:4}}>（税別）</span></div>
          </div>
          <div style={{display:'flex',gap:6}}>
            <button onClick={reset} style={{flex:1,padding:'6px 10px',border:`1px solid ${C.border}`,borderRadius:6,background:'#fff',fontSize:11,cursor:'pointer',color:C.textSub}}>やり直す</button>
            <button onClick={()=>onAdd(result)}
              style={{flex:2,padding:'6px 10px',background:'#0369a1',color:'#fff',border:'none',borderRadius:6,fontSize:11,fontWeight:700,cursor:'pointer'}}>
              ✓ この金額を見積もりに反映
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function CurtainPage(){
  const [customer,setCustomer]=useState('');
  const [subject,setSubject]=useState('巻き上げ式カーテン');
  const [showPdf,setShowPdf]=useState(false);
  const [piaCnt,setPiaCnt]=useState(0);
  const [tekkoNinku,setTekkoNinku]=useState(1);
  const [tekkoDays,setTekkoDays]=useState(1);
  const [fabricResult,setFabricResult]=useState(null);
  const [ironLines,setIronLines]=useState([]);
  const [ironSearch,setIronSearch]=useState('');
  const [ironCat,setIronCat]=useState(null);
  const [genbaKinku,setGenbaKinku]=useState(1);
  const [genbaDays,setGenbaDays]=useState(1);
  const [adjustLabel,setAdjustLabel]=useState('');
  const [adjustAmount,setAdjustAmount]=useState('');
  const ironFiltered=IRON_DATA.filter(d=>{
    const matchCat=!ironCat||d.cat===ironCat;
    const q=ironSearch.trim().toLowerCase();
    return matchCat&&(!q||d.spec.toLowerCase().includes(q)||d.sub.toLowerCase().includes(q));
  });
  const ironGroups={};
  ironFiltered.forEach(d=>{ if(!ironGroups[d.sub]) ironGroups[d.sub]=[]; ironGroups[d.sub].push(d); });

  function addIron(item){
    setIronLines(prev=>{
      const exist=prev.find(l=>l.spec===item.spec&&l.sub===item.sub);
      if(exist) return prev.map(l=>l.spec===item.spec&&l.sub===item.sub?{...l,qty:l.qty+1}:l);
      return [...prev,{id:genCurtainFabricId(),cat:item.cat,sub:item.sub,spec:item.spec,delivery:item.delivery,qty:1}];
    });
  }
  const ironUnitPrice=l=>Math.round(l.delivery*1.2);
  const ironLineTotal=l=>ironUnitPrice(l)*l.qty;
  const piaTotal   = piaCnt * CURTAIN_TEARDOWN_PRICE;
  const tekkoTotal = tekkoNinku * tekkoDays * CURTAIN_KOUJOU_TEKKO;
  const fabricTotal= fabricResult ? fabricResult.sub : 0;
  const ironTotal  = ironLines.reduce((a,l)=>a+ironLineTotal(l),0);
  const genbaTotal = genbaKinku * genbaDays * CURTAIN_GENBA_PRICE;
  const baseTotal  = piaTotal+tekkoTotal+fabricTotal+ironTotal+genbaTotal;
  const unsohi     = Math.round(baseTotal*0.10);
  const fukushizai = Math.round(baseTotal*0.05);
  const shokeihi   = Math.round(baseTotal*0.10);

  const adj        = parseInt(adjustAmount)||0;
  const preSub     = baseTotal+unsohi+fukushizai+shokeihi;
  const subTotal   = preSub + adj;
  const tax        = Math.round(subTotal*0.10);
  const grandTotal = subTotal + tax;

  const inp={width:'100%',background:'#f8fafd',border:'1.5px solid var(--border)',borderRadius:'var(--radius)',padding:'8px 11px',fontSize:13,color:'var(--text)'};

    <div style={{display:'flex',alignItems:'center',gap:8,margin:'18px 0 10px',paddingBottom:6,borderBottom:`2px solid ${C.navy}`}}>
      <span style={{fontSize:15}}>{icon}</span>
      <span style={{fontSize:14,fontWeight:800,color:C.navy}}>{title}</span>
    </div>
  );

  return(
    <div>
      {showPdf&&(
        <PrintModal onClose={()=>setShowPdf(false)}>

            customer={customer} subject={subject}
            piaCnt={piaCnt} piaTotal={piaTotal}

            fabricResult={fabricResult} fabricTotal={fabricTotal}
            ironLines={ironLines} ironUnitPrice={ironUnitPrice} ironLineTotal={ironLineTotal} ironTotal={ironTotal}
            genbaKinku={genbaKinku} genbaDays={genbaDays} genbaTotal={genbaTotal}
            unsohi={unsohi} fukushizai={fukushizai} shokeihi={shokeihi}
            adj={adj} adjLabel={adjustLabel}
            subTotal={subTotal} tax={tax} grandTotal={grandTotal}/>
        </PrintModal>
      )}

      <div style={{maxWidth:900,margin:'0 auto',padding:'24px 20px'}}>
        <div style={{fontSize:12,color:'var(--text-sub)',marginBottom:6}}>ホーム › 巻き上げ式カーテン見積もり</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <div style={{width:38,height:38,background:'linear-gradient(135deg,#1e4db7,#0891b2)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🪟</div>
          <div>

function CurtainPrintContent({customer,subject,piaCnt,piaTotal,tekkoNinku,tekkoDays,tekkoTotal,
  fabricResult,fabricTotal,ironLines,ironUnitPrice,ironLineTotal,ironTotal,
  genbaKinku,genbaDays,genbaTotal,unsohi,fukushizai,shokeihi,adj,adjLabel,subTotal,tax,grandTotal}){
  const today=new Date().toISOString().slice(0,10);
  const lines=[];
  if(piaCnt>0) lines.push({item:'ピアアクター',detail:'',qty:`${piaCnt}台`,unit:`¥${(22000).toLocaleString()}`,amount:`¥${piaTotal.toLocaleString()}`});
  if(tekkoTotal>0) lines.push({item:'工場加工（鉄工）',detail:`${tekkoNinku}人工 × ${tekkoDays}日`,qty:`${tekkoNinku*tekkoDays}人工`,unit:'¥16,000',amount:`¥${tekkoTotal.toLocaleString()}`});
  if(fabricResult&&fabricTotal>0) lines.push({item:'生地製作',detail:`${fabricResult.fabric.name}　${fabricResult.area.toFixed(2)}㎡ × ${fabricResult.fabricQty}枚`,qty:`${fabricResult.area.toFixed(2)}㎡`,unit:`¥${fabricResult.fabric.designPrice.toLocaleString()}/㎡`,amount:`¥${fabricTotal.toLocaleString()}`});
  ironLines.forEach(l=>{ if(ironLineTotal(l)>0) lines.push({item:l.spec,detail:l.sub,qty:`${l.qty}本`,unit:`¥${ironUnitPrice(l).toLocaleString()}`,amount:`¥${ironLineTotal(l).toLocaleString()}`}); });
  if(genbaTotal>0) lines.push({item:'現場取付費',detail:`${genbaKinku}人工 × ${genbaDays}日`,qty:`${genbaKinku*genbaDays}人工`,unit:'¥18,000',amount:`¥${genbaTotal.toLocaleString()}`});
  if(unsohi>0) lines.push({item:'運搬費',detail:'小計の10%',qty:'1式',unit:'',amount:`¥${unsohi.toLocaleString()}`});
  if(fukushizai>0) lines.push({item:'副資材',detail:'小計の5%',qty:'1式',unit:'',amount:`¥${fukushizai.toLocaleString()}`});
  if(shokeihi>0) lines.push({item:'諸経費',detail:'小計の10%',qty:'1式',unit:'',amount:`¥${shokeihi.toLocaleString()}`});
  if(adj!==0) lines.push({item:adjLabel||'調整',detail:'',qty:'1式',unit:'',amount:`${adj<0?'-':''}¥${Math.abs(adj).toLocaleString()}`,minus:adj<0});
  return(
    <>
      <BillHead title="御見積書" quoteDate={today} subject={subject||'巻き上げ式カーテン'} addressee={customer?withHonorific(customer):' 御中'}/>
      <BillTotalBox taxIncl={grandTotal} taxExcl={subTotal} tax={tax}/>
      <BillSectionTitle>見積明細</BillSectionTitle>
      <BillDetailTable lines={lines} sub={subTotal} tax={tax} total={grandTotal}/>
      <BillNote>
        <div>● 利用日数・設営条件により金額が変動する場合があります。</div>
      </BillNote>
      <BillConfirm/>
      <BillFooterName/>
    </>
  );
}

function PawloPage({ addActivity }){
  const [clientName,setClientName]=useState('');
  const [honorific,setHonorific]=useState('御中');
  const [projectName,setProjectName]=useState('');
  const [quoteDate,setQuoteDate]=useState(new Date().toISOString().slice(0,10));
  const [selType,setSelType]=useState(PAWLO_TYPES[0].id);
  const [cart,setCart]=useState([]);          // {key, typeId, label, size, unit, qty}
  const [optLetter,setOptLetter]=useState(0); // 文字入れ・ロゴ数
  const [optWeight,setOptWeight]=useState(0); // ウェイト個数
  const [optYoko,setOptYoko]=useState(0);     // 横幕（間）
  const [adjustLabel,setAdjustLabel]=useState('特別値引き');
  const [adjustAmount,setAdjustAmount]=useState('');
  const [note,setNote]=useState('');
  const [showPdf,setShowPdf]=useState(false);

  const type = PAWLO_TYPES.find(t=>t.id===selType);

  const addToCart=(itemKey)=>{
    const price = type.items[itemKey];
    const labelBase = PAWLO_ITEM_LABELS[itemKey];
    let label = labelBase;
    if(itemKey==='yoko3') label += `（${type.yoko3label}）`;
    if(itemKey==='yoko4') label += `（${type.yoko4label}）`;
    const uid = type.id+'_'+itemKey;
    setCart(prev=>{
      const ex=prev.find(c=>c.uid===uid);
      if(ex) return prev.map(c=>c.uid===uid?{...c,qty:c.qty+1}:c);
      return [...prev,{uid,typeId:type.id,size:type.size,dim:type.dim,itemKey,label,unit:price,qty:1}];
    });
  };
  const updateQty=(uid,d)=>setCart(prev=>prev.map(c=>c.uid===uid?{...c,qty:Math.max(1,c.qty+d)}:c).filter(c=>c.qty>0));
  const removeItem=(uid)=>setCart(prev=>prev.filter(c=>c.uid!==uid));
  const itemsTotal = cart.reduce((s,c)=>s+c.unit*c.qty,0);
  const optLetterCost = optLetter*PAWLO_OPT.letter;
  const optWeightCost = optWeight*PAWLO_OPT.weight;
  const optYokoCost   = optYoko*PAWLO_OPT.yokoMaku;
  const optTotal = optLetterCost+optWeightCost+optYokoCost;
  const adjust = parseInt(adjustAmount)||0;
  const sub = itemsTotal+optTotal+adjust;
  const tax = Math.floor(sub*0.1);
  const total = sub+tax;
  const pdfLines = cart.map(c=>({
    item:`${c.size} ${c.label}`,
    detail:`${c.dim}`,
    qty:`${c.qty}`,
    unit:`${c.unit.toLocaleString()}円`,
    amount:`${(c.unit*c.qty).toLocaleString()}円`,
  }));
  const pdfOptLines = [];
  if(optLetter>0) pdfOptLines.push({item:'ロゴ・文字入れ', detail:'楷書体以外／ロゴマーク', qty:`${optLetter}件`, unit:`${PAWLO_OPT.letter.toLocaleString()}円`, amount:`${optLetterCost.toLocaleString()}円`});
  if(optWeight>0) pdfOptLines.push({item:'ウェイト', detail:'柱に付けるおもり', qty:`${optWeight}個`, unit:`${PAWLO_OPT.weight.toLocaleString()}円`, amount:`${optWeightCost.toLocaleString()}円`});
  if(optYoko>0)   pdfOptLines.push({item:'横幕（追加）', detail:'1間あたり', qty:`${optYoko}間`, unit:`${PAWLO_OPT.yokoMaku.toLocaleString()}円`, amount:`${optYokoCost.toLocaleString()}円`});

  const canQuote = cart.length>0 && clientName.trim();

  const handleQuote=()=>{
    if(!canQuote) return;
    setShowPdf(true);
    addActivity({
      id: 'PT-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900)+100),
      icon: '⛺',
      title: 'パウロテント販売見積もり',
      company: (clientName||'（顧客名未入力）')+(/(御中|様)$/.test(clientName)?'':' 御中'),

  const itemKeys=['set','kanagu','tenmaku','yoko3','yoko4'];

    <div>
    {showPdf&&(
      <PrintModal onClose={()=>setShowPdf(false)}>
        <PawloPrintContent data={{clientName,honorific,quoteDate,projectName,lines:pdfLines,optLines:pdfOptLines,sub,tax,total,note,adjust,adjustLabel}}/>
      </PrintModal>

        <div>
          <h1 style={{fontSize:22,fontWeight:900,color:C.navy}}>パウロテント 販売見積もり</h1>
          <p style={{fontSize:12,color:C.textSub}}>小中学校向け｜文字入れ無料（楷書体）｜2026/6/1価格</p>

        <span style={{background:'#7c3aed',color:'#fff',fontSize:10,borderRadius:5,padding:'3px 8px',fontWeight:800,marginLeft:4}}>NEW</span>

function calcHours(start, end){
  if(!start||!end) return 0;
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const mins=(eh*60+em)-(sh*60+sm);
  return mins>0 ? Math.round(mins/60*10)/10 : 0;
}

function RoundingAdjust({grandTotal,onApply,onReset,hasAdj,adjValue,onAdjChange}){
  const [mode,setMode]=useState('manual');
  const [targetVal,setTargetVal]=useState('');
  if(grandTotal===0) return null;
  const adj=parseInt(adjValue)||0;
  const subAfter=grandTotal+adj;
  const taxAfter=Math.floor(subAfter*0.1);
  const totalAfter=subAfter+taxAfter;
  function applyTarget(){
    const t=parseInt(targetVal);
    if(isNaN(t)||t<=0)return;
    const te=Math.round(t/1.1);
    onAdjChange(String(te-grandTotal));
    setMode('manual');
  }
  const taxInclNow=grandTotal+Math.floor(grandTotal*0.1);
  const inp={flex:1,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.4)',borderRadius:5,padding:'7px 10px',fontSize:14,fontWeight:700,color:'#fff',outline:'none',textAlign:'right',fontFamily:'inherit'};

      </div>
      <div style={{display:'flex',gap:4,marginBottom:10}}>
        {[['manual','値引き額を入力'],['target','税込合計を指定']].map(([m,l])=>(
          <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:'5px',borderRadius:5,border:'1px solid rgba(255,255,255,0.3)',background:mode===m?'rgba(255,255,255,0.2)':'transparent',color:'#fff',fontSize:10,fontWeight:mode===m?700:400,cursor:'pointer',fontFamily:'inherit'}}>
            {l}
          </button>

      </div>
      {mode==='manual'&&(
        <div>

          </div>
          <div style={{display:'flex',gap:3,marginBottom:8}}>
            {[[-100,'100'],[- 1000,'1,000'],[-10000,'10,000']].map(([v,l])=>(
              <button key={v} onClick={()=>onAdjChange(String(parseInt(adjValue||0)+v))} style={{flex:1,padding:'4px',borderRadius:4,border:'1px solid rgba(255,255,255,0.25)',background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.75)',fontSize:10,cursor:'pointer',fontFamily:'inherit'}}>
                {'-'+l}
              </button>
            ))}
          </div>
        </div>
      )}
      {mode==='target'&&(
        <div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.6)',marginBottom:2}}>{'現在の税込合計: ¥'+taxInclNow.toLocaleString()}</div>

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(e){ return {error:e}; }
  componentDidCatch(e,info){ console.error('Crash:',e,info); }
  render(){
    if(this.state.error) return(
      <div style={{padding:20,background:'#fef2f2',border:'2px solid #fca5a5',borderRadius:8,margin:16,fontFamily:'monospace',fontSize:12}}>
        <div style={{fontWeight:700,color:'#dc2626',marginBottom:8}}>⚠ エラー</div>
        <div style={{color:'#7f1d1d',whiteSpace:'pre-wrap'}}>{String(this.state.error)}</div>
      </div>
    );
    return this.props.children;
  }
}

                {['発行日時','種別','顧客名','案件名','担当者','合計金額'].map(h=>(
                  <th key={h} style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:C.textSub,textAlign:'left',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0?(
                <tr><td colSpan={6} style={{padding:32,textAlign:'center',color:C.textMuted,fontSize:13}}>発行記録がありません</td></tr>
              ):filtered.map((doc,i)=>(
                <tr key={doc.id} style={{borderBottom:`1px solid ${C.borderLight}`,background:i%2===0?'#fff':'#fafbfd'}}>
                  <td style={{padding:'10px 14px',fontSize:12,color:C.textSub,whiteSpace:'nowrap'}}>{fmtDate(doc.created_at)}</td>
                  <td style={{padding:'10px 14px'}}>
                    <span style={{
                      display:'inline-block',padding:'2px 10px',borderRadius:4,fontSize:11,fontWeight:700,
                      background:doc.doc_type==='invoice'?'#fef3e2':'#e0e9f8',
                      color:doc.doc_type==='invoice'?'#92400e':'#1e4db7',
                    }}>{doc.doc_type==='invoice'?'請求書':'見積書'}</span>
                  </td>
                  <td style={{padding:'10px 14px',fontSize:13,fontWeight:600}}>{doc.customer_name||'—'}</td>
                  <td style={{padding:'10px 14px',fontSize:12,color:C.textSub}}>{doc.project_name||'—'}</td>
                  <td style={{padding:'10px 14px',fontSize:12,color:C.textSub}}>{doc.created_by_name||'—'}</td>
                  <td style={{padding:'10px 14px',fontSize:13,fontWeight:700,color:C.navy,textAlign:'right'}}>{fmtMoney(doc.total_amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ===== マイページ =====
function MyPage({user}){
  const [docs,setDocs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState('all');

  const displayName = user?.user_metadata?.display_name || user?.email || '—';

  useEffect(()=>{
    if(!user) return;
    (async()=>{
      setLoading(true);
      const {data,error} = await supabase
        .from('documents')
        .select('*')
        .eq('created_by', user.id)
        .order('created_at',{ascending:false})
        .limit(200);
      if(!error) setDocs(data||[]);
      setLoading(false);
    })();
  },[user]);

  const filtered = filter==='all' ? docs : docs.filter(d=>d.doc_type===filter);
  const totalAmount = docs.reduce((s,d)=>s+(d.total_amount||0),0);
  const estimateCount = docs.filter(d=>d.doc_type==='estimate').length;
  const invoiceCount = docs.filter(d=>d.doc_type==='invoice').length;

  const fmtDate=(iso)=>{
    if(!iso) return '—';
    const d=new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };
  const fmtMoney=(n)=>n!=null?'¥'+Number(n).toLocaleString():'—';

  return(
    <div style={{maxWidth:1100,margin:'0 auto',padding:'24px 20px'}}>
      <div style={{fontSize:12,color:'var(--text-sub)',marginBottom:6}}>ホーム › マイページ</div>

      {/* プロフィールヘッダー */}
      <div style={{background:`linear-gradient(135deg,${C.navy} 0%,${C.blue} 100%)`,borderRadius:16,padding:'24px 28px',marginBottom:24,display:'flex',alignItems:'center',gap:20,boxShadow:'0 4px 16px rgba(15,42,92,0.18)'}}>
        <div style={{width:60,height:60,borderRadius:'50%',background:'rgba(255,255,255,0.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,border:'2px solid rgba(255,255,255,0.3)'}}>👤</div>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:'#fff',marginBottom:4}}>{displayName}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,0.7)'}}>{user?.email}</div>
        </div>
      </div>

      {/* サマリーカード */}
      {!loading&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:24}}>
          {[
            {label:'発行総件数',value:`${docs.length}件`,icon:'📄',color:C.blue,bg:'#e8eef8'},
            {label:'見積書',value:`${estimateCount}件`,icon:'📝',color:'#1e7e34',bg:'#e8f7f0'},
            {label:'請求書',value:`${invoiceCount}件`,icon:'🧾',color:'#92400e',bg:'#fef3e2'},
          ].map(({label,value,icon,color,bg})=>(
            <div key={label} style={{background:'#fff',borderRadius:12,padding:'18px 20px',border:`1px solid ${C.border}`,boxShadow:'0 1px 3px rgba(15,42,92,0.06)',display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:44,height:44,borderRadius:10,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{icon}</div>
              <div>
                <div style={{fontSize:11,color:C.textSub,fontWeight:600,marginBottom:2}}>{label}</div>
                <div style={{fontSize:22,fontWeight:900,color}}>{value}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* 累計金額バー */}
      {!loading&&docs.length>0&&(
        <div style={{background:'#fff',borderRadius:12,padding:'18px 22px',marginBottom:24,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:16,boxShadow:'0 1px 3px rgba(15,42,92,0.06)'}}>
          <div style={{fontSize:18}}>💰</div>
          <div>
            <div style={{fontSize:11,color:C.textSub,fontWeight:600,marginBottom:2}}>発行累計金額</div>
            <div style={{fontSize:26,fontWeight:900,color:C.navy}}>{fmtMoney(totalAmount)}</div>
          </div>
        </div>
      )}

      {/* 発行履歴テーブル */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <h2 style={{fontSize:15,fontWeight:800,color:C.navy}}>自分の発行履歴</h2>
        <div style={{display:'flex',gap:6,marginLeft:'auto'}}>
          {[['all','すべて'],['estimate','見積書'],['invoice','請求書']].map(([val,label])=>(
            <button key={val} onClick={()=>setFilter(val)} style={{
              padding:'5px 14px',borderRadius:20,border:'1.5px solid',fontSize:12,fontWeight:700,cursor:'pointer',
              borderColor:filter===val?C.navy:'var(--border)',
              background:filter===val?C.navy:'#fff',
              color:filter===val?'#fff':'var(--text-sub)',
            }}>{label}</button>
          ))}
        </div>
      </div>

      {loading?(
        <div style={{textAlign:'center',padding:40,color:C.textMuted}}>読み込み中…</div>
      ):(
        <div style={{background:'#fff',borderRadius:12,border:`1px solid ${C.border}`,overflow:'hidden',boxShadow:'0 1px 3px rgba(15,42,92,0.07)'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{background:'#f4f6fb',borderBottom:`1px solid ${C.border}`}}>
                {['発行日時','種別','顧客名','案件名','合計金額'].map(h=>(
                  <th key={h} style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:C.textSub,textAlign:'left',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0?(
                <tr><td colSpan={5} style={{padding:40,textAlign:'center',color:C.textMuted,fontSize:13}}>
                  {docs.length===0?'まだ見積書・請求書を発行していません':'該当する記録がありません'}
                </td></tr>
              ):filtered.map((doc,i)=>(
                <tr key={doc.id} style={{borderBottom:`1px solid ${C.borderLight}`,background:i%2===0?'#fff':'#fafbfd'}}>
                  <td style={{padding:'10px 14px',fontSize:12,color:C.textSub,whiteSpace:'nowrap'}}>{fmtDate(doc.created_at)}</td>
                  <td style={{padding:'10px 14px'}}>
                    <span style={{
                      display:'inline-block',padding:'2px 10px',borderRadius:4,fontSize:11,fontWeight:700,
                      background:doc.doc_type==='invoice'?'#fef3e2':'#e0e9f8',
                      color:doc.doc_type==='invoice'?'#92400e':'#1e4db7',
                    }}>{doc.doc_type==='invoice'?'請求書':'見積書'}</span>
                  </td>
                  <td style={{padding:'10px 14px',fontSize:13,fontWeight:600}}>{doc.customer_name||'—'}</td>
                  <td style={{padding:'10px 14px',fontSize:12,color:C.textSub}}>{doc.project_name||'—'}</td>
                  <td style={{padding:'10px 14px',fontSize:13,fontWeight:700,color:C.navy,textAlign:'right'}}>{fmtMoney(doc.total_amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function App(){
  const [page,setPage]=useState('dashboard');
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [activityLog,setActivityLog]=useState(RECENT_QUOTES);

  // セッション確認
  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);
      setAuthLoading(false);
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user||null);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const handleLogout = async ()=>{
    await supabase.auth.signOut();
    setUser(null);
    setPage('dashboard');
  };

  const addActivity = useCallback((entry)=>{
    setActivityLog(prev=>[entry,...prev].slice(0,20));
  },[]);

  if(authLoading) return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f4f6fb'}}>
      <div style={{fontSize:14,color:'#52637a'}}>読み込み中…</div>
    </div>
  );

  if(!user) return <LoginPage onLogin={setUser}/>;

  const pages={
    dashboard:<Dashboard setPage={setPage} activityLog={activityLog}/>,
    quote:<QuotePage addActivity={addActivity} user={user}/>,
      awning:<AwningPage addActivity={addActivity}/>,
      fabric:<FabricPage/>,
  free:<FreePage/>,
    pawlo:<PawloPage addActivity={addActivity}/>,
    curtain:<CurtainPage/>,
    iron:<IronPage/>,
    history:<HistoryPage/>,
    mypage:<MyPage user={user}/>,
  };
  return(
    <div>
      <NavBar page={page} setPage={setPage} user={user} onLogout={handleLogout}/>
      <div className="fade-in" key={page}>{pages[page]||pages.dashboard}</div>

      <div style={{
        textAlign:'center',padding:'18px 20px',
        fontSize:11,color:C.textMuted,
        borderTop:`1px solid ${C.border}`,
        marginTop:32,background:C.surface,
        display:'flex',justifyContent:'center',alignItems:'center',gap:20,
      }}>
        <span>© 2024 砂辺松福テント株式会社</span>
        <span style={{color:C.border}}>|</span>
        <span style={{cursor:'pointer',color:C.blue}}>利用規約</span>
        <span style={{color:C.border}}>|</span>
        <span style={{cursor:'pointer',color:C.blue}}>プライバシーポリシー</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);

</script>
</body>
</html>
